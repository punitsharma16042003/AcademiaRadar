name: Deploy AcademiaRadar to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      run_crawl:
        description: 'Run live portal crawler before deploying to GitHub Pages'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Scheduled/Manual Cloud Crawl
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_crawl == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Cloud Portal Crawler
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_crawl == 'true')
        run: node scripts/cloud_crawl.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
